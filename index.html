<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Gym Tracker</title>
<meta name="theme-color" content="#121017" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Gym Tracker" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overscroll-behavior-y: contain; }
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  .sg { font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; }
  .day-box { transition: transform 120ms ease, background 150ms ease, border-color 150ms ease; }
  .day-box:active { transform: scale(0.94); }
  .day-box:disabled { cursor: default; }
  .tab-btn, .chip, .menu-btn, .icon-btn { transition: background 150ms ease, color 150ms ease, border-color 150ms ease; }
  .chip:active, .menu-btn:active, .icon-btn:active { transform: scale(0.97); }
  ::-webkit-scrollbar { height: 6px; }
  ::-webkit-scrollbar-thumb { background: #2c2a37; border-radius: 4px; }
  #root { min-height: 100vh; }
  textarea { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

const MONTHS = [
  { name: "January", short: "Jan", color: "#FFADAD" },
  { name: "February", short: "Feb", color: "#FFD6A5" },
  { name: "March", short: "Mar", color: "#FDFFB6" },
  { name: "April", short: "Apr", color: "#CAFFBF" },
  { name: "May", short: "May", color: "#9BF6FF" },
  { name: "June", short: "Jun", color: "#A0C4FF" },
  { name: "July", short: "Jul", color: "#BDB2FF" },
  { name: "August", short: "Aug", color: "#FFC6FF" },
  { name: "September", short: "Sep", color: "#FFB4A2" },
  { name: "October", short: "Oct", color: "#E4C1F9" },
  { name: "November", short: "Nov", color: "#B9FBC0" },
  { name: "December", short: "Dec", color: "#F1C0E8" },
];

const BODY_PART_PALETTE = ["#FFADAD","#FFD6A5","#FDFFB6","#CAFFBF","#9BF6FF","#A0C4FF","#BDB2FF","#FFC6FF","#FFB4A2","#E4C1F9","#B9FBC0","#F1C0E8"];
const DEFAULT_BODY_PARTS = ["Chest", "Back", "Shoulders", "Legs", "Arms", "Core", "Cardio", "Full Body"];
const DURATIONS = ["30 min", "45 min", "60+ min"];
const WEEKDAY_LABELS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

const STREAK_MILESTONES = [3, 7, 14, 30, 60, 100, 180, 365];
const WORKOUT_MILESTONES = [10, 25, 50, 100, 250, 500, 1000];

const STORAGE_KEY = "gym-tracker-checked-days";
const SETTINGS_KEY = "gym-tracker-settings";

const DEFAULT_SETTINGS = {
  weeklyGoal: 3,
  restDayAllowance: false,
  bodyParts: DEFAULT_BODY_PARTS,
  theme: "dark",
  colorMode: "month", // "month" | "bodypart"
};

const THEMES = {
  dark: {
    bg: "#121017", card: "#18161f", card2: "#1E1B27", border: "#26232f", border2: "#2A2735",
    text: "#EDEAF4", textMuted: "#8B87A0", textDim: "#6E6B82", textFaint: "#4E4B5F",
    unchecked: "#8B87A0", checkedText: "#181521",
  },
  light: {
    bg: "#F5F3F8", card: "#FFFFFF", card2: "#F0EEF5", border: "#E4E1EC", border2: "#DAD6E5",
    text: "#221F2B", textMuted: "#6B6780", textDim: "#8A869C", textFaint: "#A8A4B8",
    unchecked: "#8A869C", checkedText: "#181521",
  },
};

function daysInMonth(year, monthIndex) { return new Date(year, monthIndex + 1, 0).getDate(); }
function keyFor(year, monthIndex) { return `${year}-${monthIndex}`; }
function dateKey(d) { return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function getWeekStart(date) {
  const d = new Date(date); d.setHours(0, 0, 0, 0);
  const day = d.getDay();
  const diff = day === 0 ? 6 : day - 1;
  d.setDate(d.getDate() - diff);
  return d;
}
function formatWeekRange(weekStart) {
  const end = new Date(weekStart); end.setDate(end.getDate() + 6);
  const opts = { month: "short", day: "numeric" };
  return `${weekStart.toLocaleDateString(undefined, opts)} – ${end.toLocaleDateString(undefined, opts)}`;
}
function migrateDay(v) {
  if (Array.isArray(v)) return { parts: v, note: "", duration: null };
  if (!v) return { parts: [], note: "", duration: null };
  return { parts: v.parts || [], note: v.note || "", duration: v.duration || null };
}
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }

function loadData() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : {}; }
  catch (e) { return {}; }
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }
  catch (e) { return false; }
}
function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    return raw ? { ...DEFAULT_SETTINGS, ...JSON.parse(raw) } : { ...DEFAULT_SETTINGS };
  } catch (e) { return { ...DEFAULT_SETTINGS }; }
}
function saveSettings(s) {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); return true; }
  catch (e) { return false; }
}

function bodyPartColor(bodyParts, part) {
  const idx = bodyParts.indexOf(part);
  if (idx === -1) return BODY_PART_PALETTE[0];
  return BODY_PART_PALETTE[idx % BODY_PART_PALETTE.length];
}

// ---- export helpers ----
function flattenEntries(data) {
  const rows = [];
  Object.keys(data).sort().forEach((k) => {
    const [yStr, mIdxStr] = k.split("-");
    const y = parseInt(yStr, 10), mIdx = parseInt(mIdxStr, 10);
    const md = data[k] || {};
    Object.keys(md).map(Number).sort((a, b) => a - b).forEach((d) => {
      const entry = migrateDay(md[String(d)]);
      if (entry.parts.length > 0) {
        const dateObj = new Date(y, mIdx, d);
        rows.push({
          Date: dateObj.toLocaleDateString(),
          Weekday: dateObj.toLocaleDateString(undefined, { weekday: "long" }),
          Month: MONTHS[mIdx] ? MONTHS[mIdx].name : mIdx,
          Year: y,
          "Body Parts": entry.parts.join(", "),
          Duration: entry.duration || "",
          Notes: entry.note || "",
        });
      }
    });
  });
  return rows;
}

function exportExcel(data) {
  const rows = flattenEntries(data);
  if (rows.length === 0) { alert("No workouts logged yet — nothing to export."); return; }
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [{ wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 6 }, { wch: 30 }, { wch: 10 }, { wch: 30 }];
  XLSX.utils.book_append_sheet(wb, ws, "Workouts");
  const counts = {};
  rows.forEach((r) => r["Body Parts"].split(", ").forEach((p) => { counts[p] = (counts[p] || 0) + 1; }));
  const summaryRows = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([part, count]) => ({ "Body Part": part, "Times Trained": count }));
  const ws2 = XLSX.utils.json_to_sheet(summaryRows);
  ws2["!cols"] = [{ wch: 14 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, ws2, "Summary");
  XLSX.writeFile(wb, `gym-tracker-${new Date().toISOString().slice(0, 10)}.xlsx`);
}

function exportPDF(data, bestWeekStreak) {
  const rows = flattenEntries(data);
  if (rows.length === 0) { alert("No workouts logged yet — nothing to export."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pageHeight = doc.internal.pageSize.getHeight();
  let y = 20;
  doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.text("Gym Tracker Report", 14, y); y += 8;
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(110, 107, 130);
  doc.text(`Generated ${new Date().toLocaleDateString()}`, 14, y); y += 10;
  doc.setTextColor(20, 20, 20); doc.setFont("helvetica", "bold"); doc.setFontSize(12);
  doc.text(`Total workouts logged: ${rows.length}`, 14, y); y += 6;
  doc.text(`Best streak: ${bestWeekStreak} consecutive week(s) meeting goal`, 14, y); y += 10;
  const counts = {};
  rows.forEach((r) => r["Body Parts"].split(", ").forEach((p) => { counts[p] = (counts[p] || 0) + 1; }));
  doc.setFontSize(13); doc.text("Body Part Totals", 14, y); y += 7;
  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([part, count]) => {
    doc.text(`${part}: ${count}`, 16, y); y += 5.5;
    if (y > pageHeight - 20) { doc.addPage(); y = 20; }
  });
  y += 6;
  if (y > pageHeight - 30) { doc.addPage(); y = 20; }
  doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.text("Workout Log", 14, y); y += 8;
  doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  rows.forEach((r) => {
    if (y > pageHeight - 15) { doc.addPage(); y = 20; }
    doc.text(`${r.Date} (${r.Weekday})`, 16, y);
    doc.text(r["Body Parts"], 62, y);
    if (r.Duration) doc.text(r.Duration, 150, y);
    y += 5;
    if (r.Notes) { doc.setTextColor(120,120,120); doc.text(`  "${r.Notes}"`, 16, y); doc.setTextColor(20,20,20); y += 5; }
  });
  doc.save(`gym-tracker-${new Date().toISOString().slice(0, 10)}.pdf`);
}

function exportBackupJSON(data, settings) {
  const blob = new Blob([JSON.stringify({ data, settings, exportedAt: new Date().toISOString() }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `gym-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function GymTracker() {
  const today = useMemo(() => new Date(), []);
  const [year, setYear] = useState(today.getFullYear());
  const [monthIndex, setMonthIndex] = useState(today.getMonth());
  const [data, setData] = useState(() => loadData());
  const [settings, setSettings] = useState(() => loadSettings());
  const [error, setError] = useState(null);
  const [selectedDay, setSelectedDay] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [page, setPage] = useState("main"); // main | history | settings
  const [newBodyPart, setNewBodyPart] = useState("");
  const fileInputRef = React.useRef(null);

  const theme = THEMES[settings.theme] || THEMES.dark;

  const persistData = useCallback((next) => {
    const ok = saveData(next);
    setError(ok ? null : "Couldn't save — your browser may be blocking storage.");
  }, []);
  const persistSettings = useCallback((next) => {
    setSettings(next);
    saveSettings(next);
  }, []);

  const monthKey = keyFor(year, monthIndex);
  const rawMonthData = data[monthKey] || {};
  const monthData = useMemo(() => {
    const out = {};
    Object.keys(rawMonthData).forEach((d) => { out[d] = migrateDay(rawMonthData[d]); });
    return out;
  }, [rawMonthData]);

  const isEditable = useCallback((day) => {
    const d = startOfDay(new Date(year, monthIndex, day));
    const t = startOfDay(today);
    const yest = new Date(t); yest.setDate(yest.getDate() - 1);
    return d.getTime() === t.getTime() || d.getTime() === yest.getTime();
  }, [year, monthIndex, today]);

  const updateDayEntry = (day, patch) => {
    const dayKey = String(day);
    const current = monthData[dayKey] || { parts: [], note: "", duration: null };
    const nextEntry = { ...current, ...patch };
    const nextMonthData = { ...rawMonthData };
    if (nextEntry.parts.length === 0 && !nextEntry.note && !nextEntry.duration) delete nextMonthData[dayKey];
    else nextMonthData[dayKey] = nextEntry;
    const next = { ...data, [monthKey]: nextMonthData };
    setData(next); persistData(next);
  };

  const toggleBodyPart = (day, part) => {
    const current = monthData[String(day)] || { parts: [], note: "", duration: null };
    const set = new Set(current.parts);
    if (set.has(part)) set.delete(part); else set.add(part);
    updateDayEntry(day, { parts: Array.from(set) });
  };

  const clearDay = (day) => {
    const dayKey = String(day);
    const nextMonthData = { ...rawMonthData };
    delete nextMonthData[dayKey];
    const next = { ...data, [monthKey]: nextMonthData };
    setData(next); persistData(next);
    setSelectedDay(null);
  };

  const month = MONTHS[monthIndex];
  const totalDays = daysInMonth(year, monthIndex);
  const checkedDaysThisMonth = useMemo(
    () => new Set(Object.keys(monthData).filter((d) => (monthData[d].parts || []).length > 0).map(Number)),
    [monthData]
  );

  // Flatten every logged day across all months/years
  const allEntries = useMemo(() => {
    const entries = [];
    Object.keys(data).forEach((k) => {
      const [yStr, mIdxStr] = k.split("-");
      const y = parseInt(yStr, 10), mIdx = parseInt(mIdxStr, 10);
      const md = data[k] || {};
      Object.keys(md).forEach((dStr) => {
        const entry = migrateDay(md[dStr]);
        if (entry.parts.length > 0) entries.push({ date: new Date(y, mIdx, parseInt(dStr, 10)), ...entry });
      });
    });
    entries.sort((a, b) => b.date - a.date);
    return entries;
  }, [data]);

  const checkedDateSet = useMemo(() => new Set(allEntries.map((e) => dateKey(e.date))), [allEntries]);

  // Current day-streak (global, with optional rest-day allowance), capped lookback
  const currentStreak = useMemo(() => {
    let streak = 0, cursor = startOfDay(today);
    const restUsedWeeks = new Set();
    for (let i = 0; i < 1000; i++) {
      const key = dateKey(cursor);
      if (checkedDateSet.has(key)) { streak++; }
      else if (settings.restDayAllowance) {
        const wk = getWeekStart(cursor).toISOString().slice(0, 10);
        if (!restUsedWeeks.has(wk)) restUsedWeeks.add(wk);
        else break;
      } else break;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }, [checkedDateSet, settings.restDayAllowance, today]);

  const weeksMap = useMemo(() => {
    const map = new Map();
    allEntries.forEach(({ date, parts }) => {
      const ws = getWeekStart(date), wk = ws.toISOString().slice(0, 10);
      if (!map.has(wk)) map.set(wk, { start: ws, dayCount: 0, partCounts: {} });
      const e = map.get(wk); e.dayCount += 1;
      parts.forEach((p) => { e.partCounts[p] = (e.partCounts[p] || 0) + 1; });
    });
    return map;
  }, [allEntries]);

  const bestWeekStreak = useMemo(() => {
    if (weeksMap.size === 0) return 0;
    const starts = Array.from(weeksMap.values()).map((w) => w.start.getTime()).sort((a, b) => a - b);
    let best = 0, run = 0;
    for (let t = starts[0]; t <= starts[starts.length - 1]; t += 7 * 86400000) {
      const wk = new Date(t).toISOString().slice(0, 10);
      const w = weeksMap.get(wk);
      if (w && w.dayCount >= settings.weeklyGoal) { run += 1; best = Math.max(best, run); }
      else run = 0;
    }
    return best;
  }, [weeksMap, settings.weeklyGoal]);

  const currentWeekSummary = useMemo(() => {
    const ws = getWeekStart(today), wk = ws.toISOString().slice(0, 10);
    return weeksMap.get(wk) || { start: ws, dayCount: 0, partCounts: {} };
  }, [weeksMap, today]);

  const monthlyPartCounts = useMemo(() => {
    const counts = {};
    Object.values(monthData).forEach((entry) => entry.parts.forEach((p) => { counts[p] = (counts[p] || 0) + 1; }));
    return Object.entries(counts).sort((a, b) => b[1] - a[1]);
  }, [monthData]);

  const monthTotals = useMemo(() => {
    return MONTHS.map((_, idx) => {
      const md = data[keyFor(year, idx)] || {};
      const count = Object.keys(md).filter((d) => migrateDay(md[d]).parts.length > 0).length;
      return { count, total: daysInMonth(year, idx) };
    });
  }, [data, year]);

  const totalWorkouts = allEntries.length;
  const streakMilestone = useMemo(() => [...STREAK_MILESTONES].reverse().find((m) => currentStreak >= m) || null, [currentStreak]);
  const workoutMilestone = useMemo(() => [...WORKOUT_MILESTONES].reverse().find((m) => totalWorkouts >= m) || null, [totalWorkouts]);

  const goMonth = (delta) => {
    let m = monthIndex + delta, y = year;
    if (m > 11) { m = 0; y += 1; } else if (m < 0) { m = 11; y -= 1; }
    setMonthIndex(m); setYear(y); setSelectedDay(null);
  };
  const goYear = (delta) => { setYear((y) => y + delta); setSelectedDay(null); };
  const jumpToToday = () => { setYear(today.getFullYear()); setMonthIndex(today.getMonth()); setSelectedDay(today.getDate()); };

  const selectedEntry = selectedDay ? (monthData[String(selectedDay)] || { parts: [], note: "", duration: null }) : null;
  const selectedEditable = selectedDay ? isEditable(selectedDay) : false;

  // Calendar grid: pad with blanks so weeks align Mon-Sun
  const firstDow = new Date(year, monthIndex, 1).getDay(); // 0=Sun
  const leadingBlanks = firstDow === 0 ? 6 : firstDow - 1;
  const gridCells = [...Array(leadingBlanks).fill(null), ...Array.from({ length: totalDays }, (_, i) => i + 1)];

  // Yearly heatmap cells
  const yearCells = useMemo(() => {
    const start = getWeekStart(new Date(year, 0, 1));
    const endBase = getWeekStart(new Date(year, 11, 31));
    const end = new Date(endBase); end.setDate(end.getDate() + 6);
    const cells = [];
    let cursor = new Date(start);
    while (cursor <= end) { cells.push(new Date(cursor)); cursor = new Date(cursor.getTime() + 86400000); }
    return cells;
  }, [year]);

  const addBodyPart = () => {
    const v = newBodyPart.trim();
    if (!v || settings.bodyParts.includes(v)) return;
    persistSettings({ ...settings, bodyParts: [...settings.bodyParts, v] });
    setNewBodyPart("");
  };
  const removeBodyPart = (part) => {
    persistSettings({ ...settings, bodyParts: settings.bodyParts.filter((p) => p !== part) });
  };

  const handleRestoreFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (parsed.data) { setData(parsed.data); persistData(parsed.data); }
        if (parsed.settings) persistSettings({ ...DEFAULT_SETTINGS, ...parsed.settings });
        alert("Backup restored successfully.");
      } catch (err) { alert("Couldn't read that file — make sure it's a Gym Tracker backup JSON."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const getDayColor = (day) => {
    if (settings.colorMode === "bodypart") {
      const entry = monthData[String(day)];
      if (entry && entry.parts.length > 0) return bodyPartColor(settings.bodyParts, entry.parts[0]);
    }
    return month.color;
  };

  const wrap = { minHeight: "100vh", background: theme.bg, color: theme.text, padding: "28px 16px 60px" };

  return (
    <div style={wrap}>
      <div style={{ maxWidth: 720, margin: "0 auto" }}>

        {/* Header */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 34, height: 34, borderRadius: 10, background: `${month.color}22`, border: `1px solid ${month.color}55`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 }}>🏋️</div>
            <h1 className="sg" style={{ fontSize: 22, fontWeight: 700, margin: 0, letterSpacing: "-0.01em" }}>Gym Tracker</h1>
          </div>
          <div style={{ display: "flex", gap: 6, position: "relative" }}>
            <button className="icon-btn" onClick={() => setPage(page === "history" ? "main" : "history")} style={{ background: theme.card, border: `1px solid ${theme.border}`, borderRadius: 10, color: theme.textMuted, padding: "8px 10px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>🕒</button>
            <button className="icon-btn" onClick={() => setPage(page === "settings" ? "main" : "settings")} style={{ background: theme.card, border: `1px solid ${theme.border}`, borderRadius: 10, color: theme.textMuted, padding: "8px 10px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>⚙️</button>
            <button className="menu-btn" onClick={() => setMenuOpen((o) => !o)} style={{ background: theme.card, border: `1px solid ${theme.border}`, borderRadius: 10, color: theme.textMuted, padding: "8px 10px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Export ⋯</button>
            {menuOpen && (
              <div style={{ position: "absolute", right: 0, top: "calc(100% + 6px)", background: theme.card2, border: `1px solid ${theme.border2}`, borderRadius: 12, padding: 6, zIndex: 10, minWidth: 170, boxShadow: "0 8px 24px rgba(0,0,0,0.4)" }}>
                <button className="menu-btn" onClick={() => { exportExcel(data); setMenuOpen(false); }} style={{ display: "block", width: "100%", textAlign: "left", background: "none", border: "none", color: theme.text, padding: "9px 10px", fontSize: 13.5, borderRadius: 8, cursor: "pointer" }}>📊 Export Excel</button>
                <button className="menu-btn" onClick={() => { exportPDF(data, bestWeekStreak); setMenuOpen(false); }} style={{ display: "block", width: "100%", textAlign: "left", background: "none", border: "none", color: theme.text, padding: "9px 10px", fontSize: 13.5, borderRadius: 8, cursor: "pointer" }}>📄 Export PDF</button>

                    const checked = inYear && checkedDateSet.has(key);
                    const c = checked ? MONTHS[d.getMonth()].color : theme.card2;
                    return <div key={i} title={inYear ? d.toLocaleDateString() : ""} style={{ width: 10, height: 10, borderRadius: 2, background: inYear ? c : "transparent" }} />;
                  })}
                </div>
              </div>
            </div>
          </React.Fragment>
        )}

        {error && <div style={{ marginTop: 16, fontSize: 12, color: "#FFADAD" }}>{error}</div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GymTracker />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
